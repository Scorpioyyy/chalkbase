[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verichalk-curriculum"
version = "0.1.0"
description = "VeriChalk 课程知识库：数据模型、构建流水线、查询接口"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["curriculum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

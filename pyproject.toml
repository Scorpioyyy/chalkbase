[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chalkbase"
version = "0.1.0"
description = "ChalkBase：北师大版小学数学课程知识库——数据模型、构建流水线、查询接口"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["chalkbase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VeriChalk 人工核验</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --border: #e2e0da; --text: #2b2a27; --muted: #7a776e;
    --accept: #2f7d4f; --reject: #b3452c; --unsure: #b98a1e; --accent: #3f6b8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 16px; margin: 0; }
  header .stats { font-size: 13px; color: var(--muted); }
  .toolbar { padding: 10px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--panel); border-bottom: 1px solid var(--border); }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button:hover { background: #f0f0ec; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { max-width: 880px; margin: 24px auto; padding: 0 16px 80px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; }
  .field { margin-bottom: 14px; }
  .field .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .field .value { font-size: 14px; white-space: pre-wrap; line-height: 1.6; }
  .confidence { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eee; font-size: 12px; }
  .verdicts { display: flex; gap: 10px; margin: 18px 0; }
  .verdicts button { flex: 1; padding: 12px; font-size: 14px; font-weight: 600; }
  .v-accept { border-color: var(--accept); color: var(--accept); }
  .v-accept.active { background: var(--accept); color: #fff; }
  .v-reject { border-color: var(--reject); color: var(--reject); }
  .v-reject.active { background: var(--reject); color: #fff; }
  .v-unsure { border-color: var(--unsure); color: var(--unsure); }
  .v-unsure.active { background: var(--unsure); color: #fff; }
  textarea { width: 100%; min-height: 60px; font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--border); resize: vertical; }
  .nav { display: flex; justify-content: space-between; margin-top: 18px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 24px; line-height: 1.8; }
  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  .progress-bar { height: 4px; background: var(--border); }
  .progress-fill { height: 100%; background: var(--accent); transition: width .2s; }
  kbd { background: #eee; border-radius: 4px; padding: 1px 6px; font-family: inherit; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>VeriChalk 人工核验</h1>
  <div class="stats" id="stats">未加载数据</div>
</header>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="toolbar">
  <input type="file" id="fileInput" accept="application/json">
  <button id="loadSampleBtn">加载示例数据</button>
  <button id="exportBtn" class="primary">导出核验结果 JSON</button>
  <span style="color:var(--muted); font-size:12px;">支持的输入格式：JSON 数组，每条含 id / task_type / input_summary / conclusion / confidence / reasoning</span>
</div>
<main>
  <div id="content"><div class="empty">请加载待核验的 JSON 文件（如 Judgment 记录抽样、金标抽样等）</div></div>
</main>

<script>
(function () {
  const state = { items: [], index: 0, verdicts: {}, storageKey: null };

  const el = (id) => document.getElementById(id);

  function loadFromStorage() {
    if (!state.storageKey) return;
    try {
      const raw = localStorage.getItem(state.storageKey);
      if (raw) state.verdicts = JSON.parse(raw);
    } catch (e) { /* ignore */ }
  }

  function saveToStorage() {
    if (!state.storageKey) return;
    try { localStorage.setItem(state.storageKey, JSON.stringify(state.verdicts)); } catch (e) { /* ignore */ }
  }

  function computeStorageKey(items) {
    const idsSig = items.map(i => i.id).join(",");
    let hash = 0;
    for (let i = 0; i < idsSig.length; i++) { hash = (hash * 31 + idsSig.charCodeAt(i)) | 0; }
    return "verichalk_label_" + hash;
  }

  function setItems(items) {
    state.items = items;
    state.index = 0;
    state.storageKey = computeStorageKey(items);
    state.verdicts = {};
    loadFromStorage();
    render();
  }

  function currentVerdict() {
    const item = state.items[state.index];
    return item ? (state.verdicts[item.id] || {}) : {};
  }

  function setVerdict(v) {
    const item = state.items[state.index];
    if (!item) return;
    const prev = state.verdicts[item.id] || {};
    state.verdicts[item.id] = { verdict: v, note: prev.note || "", ts: new Date().toISOString() };
    saveToStorage();
    render();
  }

  function setNote(note) {
    const item = state.items[state.index];
    if (!item) return;
    const prev = state.verdicts[item.id] || { verdict: null };
    state.verdicts[item.id] = { ...prev, note, ts: new Date().toISOString() };
    saveToStorage();
  }

  function go(delta) {
    if (!state.items.length) return;
    state.index = Math.max(0, Math.min(state.items.length - 1, state.index + delta));
    render();
  }

  function render() {
    const total = state.items.length;
    const done = Object.keys(state.verdicts).filter(k => state.verdicts[k].verdict).length;
    el("stats").textContent = total ? `第 ${state.index + 1} / ${total} 条 · 已核验 ${done} / ${total}` : "未加载数据";
    el("progressFill").style.width = total ? `${(done / total) * 100}%` : "0%";

    if (!total) {
      el("content").innerHTML = '<div class="empty">请加载待核验的 JSON 文件</div>';
      return;
    }
    const item = state.items[state.index];
    const v = currentVerdict();
    el("content").innerHTML = `
      <div class="card">
        <div class="field"><div class="label">ID / 任务类型</div><div class="value">${escapeHtml(item.id || "")} · ${escapeHtml(item.task_type || "")}</div></div>
        <div class="field"><div class="label">输入摘要</div><div class="value">${escapeHtml(item.input_summary || "")}</div></div>
        <div class="field"><div class="label">模型结论</div><div class="value">${escapeHtml(item.conclusion || "")} ${item.confidence != null ? `<span class="confidence">置信度 ${item.confidence}</span>` : ""}</div></div>
        <div class="field"><div class="label">理由</div><div class="value">${escapeHtml(item.reasoning || "")}</div></div>
        <div class="verdicts">
          <button class="v-accept ${v.verdict === 'accept' ? 'active' : ''}" data-v="accept">✔ 采纳 (1)</button>
          <button class="v-reject ${v.verdict === 'reject' ? 'active' : ''}" data-v="reject">✘ 拒绝 (2)</button>
          <button class="v-unsure ${v.verdict === 'unsure' ? 'active' : ''}" data-v="unsure">? 不确定 (3)</button>
        </div>
        <div class="field">
          <div class="label">备注（可选）</div>
          <textarea id="noteBox" placeholder="记录你的判断理由，尤其是拒绝/不确定时">${escapeHtml(v.note || "")}</textarea>
        </div>
        <div class="nav">
          <button id="prevBtn">← 上一条 (←)</button>
          <button id="nextBtn">下一条 (→) →</button>
        </div>
      </div>
      <div class="hint">
        快捷键：<kbd>1</kbd> 采纳　<kbd>2</kbd> 拒绝　<kbd>3</kbd> 不确定　<kbd>←</kbd>/<kbd>→</kbd> 切换条目　备注框内快捷键不生效，点击卡片空白处恢复。
      </div>
    `;
    el("prevBtn").onclick = () => go(-1);
    el("nextBtn").onclick = () => go(1);
    el("noteBox").oninput = (e) => setNote(e.target.value);
    document.querySelectorAll(".verdicts button").forEach(btn => {
      btn.onclick = () => setVerdict(btn.dataset.v);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function exportResults() {
    const rows = state.items.map(item => ({
      id: item.id,
      task_type: item.task_type || null,
      verdict: (state.verdicts[item.id] || {}).verdict || null,
      note: (state.verdicts[item.id] || {}).note || "",
      ts: (state.verdicts[item.id] || {}).ts || null,
    }));
    const blob = new Blob([JSON.stringify(rows, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `label_results_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  el("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error("顶层必须是数组");
        setItems(data);
      } catch (err) {
        alert("解析失败：" + err.message);
      }
    };
    reader.readAsText(file, "utf-8");
  });

  el("loadSampleBtn").addEventListener("click", () => {
    setItems([
      {
        id: "sample.001",
        task_type: "pairwise_entity_resolution",
        input_summary: "候选对：「万以内数的认识」 vs 「亿以内数的认识」",
        conclusion: "different（螺旋扩展，不合并）",
        confidence: 0.92,
        reasoning: "两者数域不同（万以内 vs 亿以内），后者要求掌握更大数位的读写规则，属于递进关系而非同一知识点。",
      },
      {
        id: "sample.002",
        task_type: "prerequisite_judgment",
        input_summary: "候选边：「因数与倍数」 → 「分数的意义与性质」",
        conclusion: "prerequisite",
        confidence: 0.78,
        reasoning: "约分/通分需要用到公因数、公倍数的概念，若未掌握因数倍数，理解分数的基本性质会有困难。",
      },
    ]);
  });

  el("exportBtn").addEventListener("click", exportResults);

  document.addEventListener("keydown", (e) => {
    if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
    if (e.key === "1") setVerdict("accept");
    else if (e.key === "2") setVerdict("reject");
    else if (e.key === "3") setVerdict("unsure");
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "ArrowRight") go(1);
  });

  render();
})();
</script>
</body>
</html>

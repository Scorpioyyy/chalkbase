  domain: ip
  stage: s2
  topic: 主题活动
  text: 主题活动“年、月、日的秘密”：认识年、月、日，知道它们之间的关系，能运用年、月、日的知识解释生活中的问题
- id: cs.ip.s2.03
  domain: ip
  stage: s2
  topic: 主题活动
  text: 主题活动“年、月、日的秘密”：了解中国古代如何认识一年四季
  note: 传统文化类内容，学业要求为知道一年四季的重要性、了解土圭之法
- id: cs.ip.s2.04
  domain: ip
  stage: s2
  topic: 主题活动
  text: 主题活动“曹冲称象的故事”：感受并认识克、千克、吨，以及它们之间的关系
- id: cs.ip.s2.05
  domain: ip
  stage: s2
  topic: 主题活动
  text: 主题活动“曹冲称象的故事”：感受等量的等量相等
- id: cs.ip.s2.06
  domain: ip
  stage: s2
  topic: 主题活动
  text: 主题活动“寻找宝藏”：认识东北、西北、东南、西南四个方向，会描绘物体所在的方向
- id: cs.ip.s2.07
  domain: ip
  stage: s2
  topic: 主题活动
  text: 主题活动“寻找宝藏”：了解“几点钟方向”
- id: cs.ip.s2.08
  domain: ip
  stage: s2
  topic: 主题活动
  text: 主题活动“度量衡的故事”：知道中国在秦朝统一了度量衡，理解度量衡的意义

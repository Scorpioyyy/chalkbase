  domain: ip
  stage: s3
  topic: 项目学习
  text: 项目学习“水是生命之源”：调查生活中使用淡水的习惯及用量，结合淡水资源分布等信息发现、提出并解决问题，制订节水方案
  note: 活动类条目，课标未规定具体知识点；课标说明活动名称与内容仅供参考

  domain: ip
  stage: s3
  topic: 主题活动
  text: 主题活动“体育中的数学”：收集体育赛事信息等素材，提出数学问题，设计问题解决方案
  note: 活动类条目，课标未规定具体知识点；课标说明活动名称与内容仅供参考

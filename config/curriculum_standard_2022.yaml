  domain: ip
  stage: s1
  topic: 主题活动
  text: 主题活动“数学连环画”：结合自己的生活，运用学过的数学知识记录自己的经历，或讲述含有数学知识的小故事，表达对数量关系的理解
  note: 活动类条目，课标未规定具体知识点；课标说明活动名称与内容仅供参考
- id: cs.ip.s2.01
  domain: ip
  stage: s2
  topic: 主题活动
  text: 主题活动“年、月、日的秘密”：知道24时记时法

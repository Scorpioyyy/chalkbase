source:
  url: http://www.moe.gov.cn/srcsite/A26/s8001/202204/W020220420582346895190.pdf
  retrieved: '2026-10-03'
  note: 取自教育部官网发布的《义务教育数学课程标准（2022年版）》官方PDF第四章“课程内容·小学部分”（印刷页码17-52），已逐页核对原文（PDF 为扫描图像，渲染后逐页读图，非 OCR）。只收“内容要求”，按原文每个“知道/认识/会/能/理解/经历”小句拆为原子条目；纯素养性表述（如“形成初步的数感、符号意识、运算能力和推理意识”“增强空间观念和量感”）未单列。note字段中标“学业要求：”“教学提示：”的内容来自同一主题的学业要求/教学提示，用于限定范围（如“不超过三步”“限于自然数”），不是额外条目。综合与实践各学段的内容要求以主题活动/项目学习形式给出，课标声明其名称与内容仅供参考。
items:
- id: cs.na.s1.01
  domain: na
  stage: s1
  topic: 数与运算
  text: 在实际情境中感悟并理解万以内数的意义
  note: 学业要求：能认、读、写万以内的数；能说出不同数位上的数表示的数值
- id: cs.na.s1.02
  domain: na
  stage: s1
  topic: 数与运算
  text: 理解数位的含义
- id: cs.na.s1.03
  domain: na
  stage: s1
  topic: 数与运算
  text: 知道用算盘可以表示多位数
- id: cs.na.s1.04
  domain: na
  stage: s1
  topic: 数与运算
  text: 了解符号<、=、>的含义，会比较万以内数的大小
  note: 学业要求：能用符号表示数的大小关系
- id: cs.na.s1.05
  domain: na
  stage: s1
  topic: 数与运算
  text: 通过数的大小比较，感悟相等和不等关系
- id: cs.na.s1.06
  domain: na
  stage: s1
  topic: 数与运算
  text: 在具体情境中，了解四则运算的意义
- id: cs.na.s1.07
  domain: na
  stage: s1
  topic: 数与运算
  text: 感悟四则运算之间的关系
- id: cs.na.s1.08
  domain: na
  stage: s1
  topic: 数与运算
  text: 探索加法和减法的算理与算法，会整数加减法
  note: 学业要求：能熟练口算20以内的加减法，能口算简单的百以内加减法，能计算两位数和三位数的加减法；知道减法是加法的逆运算
- id: cs.na.s1.09
  domain: na
  stage: s1
  topic: 数与运算
  text: 探索乘法和除法的算理与算法，会简单的整数乘除法
  note: 学业要求：能熟练口算表内乘除法；知道乘法是加法的简便运算、除法是乘法的逆运算
- id: cs.na.s1.10
  domain: na
  stage: s1
  topic: 数量关系
  text: 在简单的生活情境中，运用数和数的运算解决问题，能解释结果的实际意义
- id: cs.na.s1.11
  domain: na
  stage: s1
  topic: 数量关系
  text: 探索用数或符号表达简单情境中的变化规律
- id: cs.na.s2.01
  domain: na
  stage: s2
  topic: 数与运算
  text: 在具体情境中，认识万以上的数，了解十进制计数法
  note: 学业要求：能认、读、写万以上的数，会用万、亿为单位表示大数
- id: cs.na.s2.02
  domain: na
  stage: s2
  topic: 数与运算
  text: 探索并掌握多位数的乘除法，感悟从未知到已知的转化
  note: 学业要求：能计算两位数乘三位数
- id: cs.na.s2.03
  domain: na
  stage: s2
  topic: 数与运算
  text: 结合具体情境，初步认识小数
- id: cs.na.s2.04
  domain: na
  stage: s2
  topic: 数与运算
  text: 结合具体情境，初步认识分数，感悟分数单位
- id: cs.na.s2.05
  domain: na
  stage: s2
  topic: 数与运算
  text: 会同分母分数的加减法
  note: 学业要求：能进行同分母分数的加减运算；能直观描述分数并比较简单的分数的大小
- id: cs.na.s2.06
  domain: na
  stage: s2
  topic: 数与运算
  text: 会一位小数的加减法
  note: 学业要求：能进行一位小数的加减运算；能直观描述小数并比较简单的小数的大小
- id: cs.na.s2.07
  domain: na
  stage: s2
  topic: 数与运算
  text: 在解决简单实际问题的过程中，理解四则运算的意义
- id: cs.na.s2.08
  domain: na
  stage: s2
  topic: 数与运算
  text: 能进行整数四则混合运算
  note: 学业要求：以两步为主，不超过三步，正确运用小括号和中括号；能描述减法与加法、除法与乘法的关系
- id: cs.na.s2.09
  domain: na
  stage: s2
  topic: 数与运算
  text: 探索并理解运算律（加法交换律和结合律、乘法交换律和结合律、乘法对加法的分配律）
  note: 学业要求：能说出运算律的含义，能运用运算律进行简便运算，解决相关的简单实际问题
- id: cs.na.s2.10
  domain: na
  stage: s2
  topic: 数与运算
  text: 能用字母表示运算律
- id: cs.na.s2.11
  domain: na
  stage: s2
  topic: 数与运算
  text: 会运用数描述生活情境中事物的特征
- id: cs.na.s2.12
  domain: na
  stage: s2
  topic: 数量关系
  text: 在实际情境中，运用数和数的运算解决问题
- id: cs.na.s2.13
  domain: na
  stage: s2
  topic: 数量关系
  text: 在解决实际问题的过程中，能结合具体情境，选择合适的单位进行简单估算，体会估算在生活中的作用
- id: cs.na.s2.14
  domain: na
  stage: s2
  topic: 数量关系
  text: 能借助计算器进行计算，解决简单的实际问题
- id: cs.na.s2.15
  domain: na
  stage: s2
  topic: 数量关系
  text: 探索简单的规律
- id: cs.na.s2.16
  domain: na
  stage: s2
  topic: 数量关系
  text: 在具体情境中，认识常见数量关系：总量=分量+分量、总价=单价×数量、路程=速度×时间
  note: 教学提示：加法模型表示总量等于各分量之和；乘法模型分为与个数有关（总价=单价×数量）和与物理量有关（路程=速度×时间）两种形式
- id: cs.na.s2.17
  domain: na
  stage: s2
  topic: 数量关系
  text: 能利用常见数量关系解决简单的实际问题
- id: cs.na.s2.18
  domain: na
  stage: s2
  topic: 数量关系
  text: 能在具体情境中了解等量的等量相等
  note: 学业要求：能合理利用等量的等量相等进行推理
- id: cs.na.s2.19
  domain: na
  stage: s2
  topic: 数量关系
  text: 能解决生活中的简单问题，并能对结果的实际意义作出解释，经历探索简单规律的过程
- id: cs.na.s3.01
  domain: na
  stage: s3
  topic: 数与运算
  text: 知道2、3、5的倍数的特征
  note: 学业要求：在1～100的自然数中，能找出2、3、5的倍数；能找出10以内自然数的所有倍数
- id: cs.na.s3.02
  domain: na
  stage: s3
  topic: 数与运算
  text: 了解公倍数和最小公倍数
  note: 学业要求：能找出10以内两个自然数的公倍数和最小公倍数
- id: cs.na.s3.03
  domain: na
  stage: s3
  topic: 数与运算
  text: 了解公因数和最大公因数
  note: 学业要求：能找出一个自然数的所有因数，两个自然数的公因数和最大公因数（1～100的自然数范围内）
- id: cs.na.s3.04
  domain: na
  stage: s3
  topic: 数与运算
  text: 了解奇数、偶数、质数（或素数）和合数
  note: 学业要求：能判断一个自然数是否是质数或合数（1～100的自然数范围内）
- id: cs.na.s3.05
  domain: na
  stage: s3
  topic: 数与运算
  text: 结合具体情境探索并理解小数和分数的意义，感悟计数单位
- id: cs.na.s3.06
  domain: na
  stage: s3
  topic: 数与运算
  text: 会进行小数、分数的转化
  note: 学业要求：不包括将循环小数转化成分数
- id: cs.na.s3.07
  domain: na
  stage: s3
  topic: 数与运算
  text: 结合具体情境理解整数除法与分数的关系
- id: cs.na.s3.08
  domain: na
  stage: s3
  topic: 数与运算
  text: 能进行简单的小数、分数四则运算
- id: cs.na.s3.09
  domain: na
  stage: s3
  topic: 数与运算
  text: 能进行简单的小数、分数混合运算
  note: 学业要求：不超过三步，并能说明运算过程
- id: cs.na.s3.10
  domain: na
  stage: s3
  topic: 数量关系
  text: 根据具体情境理解等式的基本性质
- id: cs.na.s3.11
  domain: na
  stage: s3
  topic: 数量关系
  text: 在解决实际问题的过程中，会选择合适的方法进行估算
- id: cs.na.s3.12
  domain: na
  stage: s3
  topic: 数量关系
  text: 在具体情境中，探索用字母表示事物的关系、性质和规律的方法，感悟用字母表示的一般性
- id: cs.na.s3.13
  domain: na
  stage: s3
  topic: 数量关系
  text: 在实际情境中理解比和比例的意义
- id: cs.na.s3.14
  domain: na
  stage: s3
  topic: 数量关系
  text: 在实际情境中理解按比例分配的含义，能解决简单的问题
- id: cs.na.s3.15
  domain: na
  stage: s3
  topic: 数量关系
  text: 通过具体情境，认识成正比的量（如y/x=5）
  note: 学业要求：能找出生活中成正比的量的实例；能根据成正比关系的数据在方格纸上画图，了解y=kx(k≠0)的形式，能根据其中一个量的值计算另一个量的值
- id: cs.na.s3.16
  domain: na
  stage: s3
  topic: 数量关系
  text: 能探索规律或变化趋势（如y=5x）
- id: cs.na.s3.17
  domain: na
  stage: s3
  topic: 数量关系
  text: 能运用常见的数量关系解决实际问题，能合理解释结果的实际意义
- id: cs.gg.s1.01
  domain: gg
  stage: s1
  topic: 图形的认识与测量
  text: 通过实物和模型辨认简单的立体图形和平面图形
  note: 学业要求：立体图形限于长方体、正方体、圆柱、球；平面图形限于长方形、正方形、平行四边形、三角形、圆；能直观描述这些图形的特征
- id: cs.gg.s1.02
  domain: gg
  stage: s1
  topic: 图形的认识与测量
  text: 能对图形分类
- id: cs.gg.s1.03
  domain: gg
  stage: s1
  topic: 图形的认识与测量
  text: 会用简单图形拼图
- id: cs.gg.s1.04
  domain: gg
  stage: s1
  topic: 图形的认识与测量
  text: 结合生活实际，体会建立统一度量单位的重要性
- id: cs.gg.s1.05
  domain: gg
  stage: s1
  topic: 图形的认识与测量
  text: 认识长度单位米、厘米
  note: 学业要求：能进行米、厘米之间的单位换算
- id: cs.gg.s1.06
  domain: gg
  stage: s1
  topic: 图形的认识与测量
  text: 能估测一些物体的长度，并进行测量
- id: cs.gg.s2.01
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 结合实例认识线段、射线和直线
- id: cs.gg.s2.02
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 体会两点间所有连线中线段最短，知道两点间距离
- id: cs.gg.s2.03
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 会用直尺和圆规作一条线段等于已知线段
- id: cs.gg.s2.04
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 了解同一平面内两条直线的位置关系
  note: 学业要求：能辨认同一平面内两条直线是否平行或垂直
- id: cs.gg.s2.05
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 结合生活情境认识角，知道角的大小关系
  note: 学业要求：能说出直角、锐角、钝角的特征，能辨认平角和周角
- id: cs.gg.s2.06
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 会用量角器量角，会用量角器或三角板画角
  note: 学业要求：能用量角器画出指定度数的角；会用三角板画30°、45°、60°、90°的角
- id: cs.gg.s2.07
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 认识长度单位千米，知道分米、毫米
  note: 学业要求：能进行长度单位之间的换算
- id: cs.gg.s2.08
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 认识面积单位厘米²、分米²、米²
  note: 学业要求：能进行面积单位之间的换算
- id: cs.gg.s2.09
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 能进行简单的单位换算
- id: cs.gg.s2.10
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 能恰当地选择单位估测一些物体的长度和面积，会进行测量
- id: cs.gg.s2.11
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 认识三角形和四边形
- id: cs.gg.s2.12
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 会根据图形特征对三角形和四边形进行分类
  note: 学业要求：三角形按角分为直角、锐角、钝角三角形，并认识等腰三角形和等边三角形；能说出长方形、正方形、平行四边形、梯形的特征及其共性与区别
- id: cs.gg.s2.13
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 结合实例认识周长和面积
- id: cs.gg.s2.14
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 探索并掌握长方形、正方形的周长和面积的计算公式
  note: 学业要求：知道什么是图形的周长，会测量三角形、长方形和正方形的周长；会计算长方形、正方形的周长和面积
- id: cs.gg.s2.15
  domain: gg
  stage: s2
  topic: 图形的认识与测量
  text: 能根据具体事物、照片或直观图辨认从不同角度观察到的简单物体
- id: cs.gg.s2.16
  domain: gg
  stage: s2
  topic: 图形的位置与运动
  text: 结合实例，感受平移、旋转、轴对称现象
  note: 学业要求：能在实际情境中辨认生活中的平移、旋转和轴对称现象，能利用平移或旋转解释现实生活中的现象
- id: cs.gg.s3.01
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 知道三角形任意两边之和大于第三边
- id: cs.gg.s3.02
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 知道三角形内角和是180°
  note: 学业要求：能根据已知两个角的度数求出第三个角的度数
- id: cs.gg.s3.03
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 认识圆和扇形，会用圆规画圆
- id: cs.gg.s3.04
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 认识圆周率
  note: 学业要求：知道圆的周长、半径和直径，了解圆的周长与其直径之比是一个定值
- id: cs.gg.s3.05
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 探索圆的周长和面积计算公式，能解决简单的实际问题
  note: 学业要求：会计算圆的周长和面积
- id: cs.gg.s3.06
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 知道面积单位千米²、公顷
- id: cs.gg.s3.07
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 探索并掌握平行四边形、三角形和梯形的面积计算公式
  note: 学业要求：会计算平行四边形、三角形、梯形的面积，能用公式解决实际问题
- id: cs.gg.s3.08
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 会估计不规则图形的面积
- id: cs.gg.s3.09
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 通过实例了解体积（或容积）的意义
- id: cs.gg.s3.10
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 知道体积（或容积）的度量单位，能进行单位之间的换算
  note: 学业要求：体积单位米³、分米³、厘米³，容积单位升、毫升
- id: cs.gg.s3.11
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 体验不规则物体体积的测量方法
- id: cs.gg.s3.12
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 认识长方体、正方体和圆柱，了解这些图形的展开图
- id: cs.gg.s3.13
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 探索并掌握长方体、正方体和圆柱的体积和表面积的计算公式
- id: cs.gg.s3.14
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 认识圆锥并探索其体积的计算公式
  note: 学业要求：能说出圆锥的特征，会计算圆锥的体积
- id: cs.gg.s3.15
  domain: gg
  stage: s3
  topic: 图形的认识与测量
  text: 能用这些公式（长方体、正方体、圆柱、圆锥的体积和表面积公式）解决简单的实际问题
- id: cs.gg.s3.16
  domain: gg
  stage: s3
  topic: 图形的认识与测量

  domain: ip
  stage: s1
  topic: 主题活动
  text: 主题活动“时间在哪里”：认识时、分、秒，结合生活经验体会并描述时间的长短
  note: 学业要求：能说出钟表上的时间，了解时、分、秒之间的关系
- id: cs.ip.s1.04
  domain: ip
  stage: s1
  topic: 主题活动
  text: 主题活动“我的教室”：会用上、下、左、右、前、后描述物体的相对位置
